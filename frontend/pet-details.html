<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Details — PawsConnect</title>
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/neumorphism.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <header class="site-header">
        <div class="app-container">
            <nav class="nav-bar">
                <a href="index.html" class="brand-logo">
                    <div class="brand-icon">🐾</div>
                    <span>Paws<span class="dot">Connect</span></span>
                </a>
                <ul class="nav-links">
                    <li><a href="index.html" class="nav-link">Home</a></li>
                    <li><a href="pets.html" class="nav-link">Browse Pets</a></li>
                    <li><a href="about.html" class="nav-link">About Us</a></li>
                    <li><a href="contact.html" class="nav-link">Contact</a></li>
                </ul>
                <div class="nav-actions">
                    <a href="login.html" class="nm-btn nm-btn-secondary nm-btn-sm">Sign In</a>
                    <a href="register.html" class="nm-btn nm-btn-primary nm-btn-sm">Register</a>
                </div>
                <button class="mobile-nav-toggle" aria-label="Toggle navigation menu">☰</button>
            </nav>
        </div>
    </header>

    <main style="padding: 3.5rem 0 5rem;">
        <div class="app-container" id="petDetailContainer">
            <!-- Dynamically loaded by Pets.loadPetDetails() -->
        </div>
    </main>

    <!-- Adoption Application Modal -->
    <div class="nm-modal-backdrop" id="adoptionAppModal">
        <div class="nm-modal">
            <div class="nm-modal-header">
                <div>
                    <h3 style="margin-bottom: 0.25rem;">Adoption Application</h3>
                    <p style="font-size: 0.85rem; color: var(--text-muted);">Applying for: <strong id="appPetName" style="color: var(--primary);">Pet</strong></p>
                </div>
                <button class="nm-modal-close" aria-label="Close dialog">&times;</button>
            </div>

            <form id="adoptionAppForm" onsubmit="event.preventDefault(); Applications.submit(this);">
                <input type="hidden" id="appPetId">

                <div class="form-group">
                    <label class="form-label" for="appHomeType">Home Type *</label>
                    <select class="nm-select" id="appHomeType" required>
                        <option value="">Select your dwelling type...</option>
                        <option value="Single Family Home">Single Family Home</option>
                        <option value="Apartment / Condo">Apartment / Condo</option>
                        <option value="Townhouse">Townhouse</option>
                        <option value="Farm / Rural">Farm / Rural</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label" for="appLiving">Living & Yard Arrangement *</label>
                    <input type="text" class="nm-input" id="appLiving" placeholder="e.g. Own home with fenced yard" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="appMembers">Household Members *</label>
                    <input type="number" class="nm-input" id="appMembers" min="1" max="20" value="1" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="appExperience">Previous Pet Experience *</label>
                    <textarea class="nm-textarea" id="appExperience" placeholder="Describe your experience with pets..." required></textarea>
                </div>

                <div class="form-group">
                    <label class="form-label" for="appReason">Reason for Adoption *</label>
                    <textarea class="nm-textarea" id="appReason" placeholder="Why would you like to adopt this companion?" required></textarea>
                </div>

                <div class="form-group">
                    <label class="form-label" for="appCare">Care & Exercise Commitment *</label>
                    <textarea class="nm-textarea" id="appCare" placeholder="Care schedule and exercise plan..." required></textarea>
                </div>

                <div class="form-group">
                    <label class="nm-checkbox-wrapper">
                        <input type="checkbox" id="appTerms" required>
                        <span>I understand that pet adoption is a lifelong commitment and agree to responsible pet ownership standards.</span>
                    </label>
                </div>

                <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                    <button type="button" class="nm-btn nm-btn-secondary" style="flex: 1;" onclick="UI.closeModal('adoptionAppModal')">Cancel</button>
                    <button type="submit" class="nm-btn nm-btn-primary" style="flex: 2;">Submit Application</button>
                </div>
            </form>
        </div>
    </div>

    <footer class="site-footer">
        <div class="app-container" style="text-align: center;">
            <p>&copy; 2026 PawsConnect Platform. Detailed disclosures and shelter partnerships.</p>
        </div>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/validation.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/pets.js"></script>
    <script src="js/applications.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            Pets.loadPetDetails();
        });
    </script>
</body>
</html>
